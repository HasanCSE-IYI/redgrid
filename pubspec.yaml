name: redgrid
description: "RedGrid - অফলাইন রক্তদাতা ডিরেক্টরি (v7.0 MVP)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  share_plus: ^13.2.0
  file_picker: ^8.1.6
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  # বাংলা ফন্ট অফলাইনে বান্ডেল করতে: assets/fonts/ এ NotoSansBengali ফাইল রেখে নিচের অংশ চালু করুন
  # fonts:
  #   - family: NotoSansBengali
  #     fonts:
  #       - asset: assets/fonts/NotoSansBengali-Regular.ttf
  #       - asset: assets/fonts/NotoSansBengali-Bold.ttf
  #         weight: 700
