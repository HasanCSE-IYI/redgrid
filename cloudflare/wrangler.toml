name = "redgrid-sync"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# D1 Database Binding
# Replace database_id with your database ID returned by:
# wrangler d1 create redgrid-db
[[d1_databases]]
binding = "DB"
database_name = "redgrid-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# Optional environment variables
# [vars]
# SYNC_KEY = "your-custom-secret-key"
